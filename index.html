<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Géographie (travel)</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quizContainer">

        <!-- Écran d'accueil -->
        <section id="accueil" class="quizScreen">
            <h1>QUIZ Géographie</h1>

            <button id="boutonStartQuiz">
                Début du quiz
            </button>
            <h3 id="nom">créateur : Luc Caron Poisson </h3>
        </section>


        <!-- Écran de jeu -->
        <section id="jeu" class="quizScreen hidden">
        
            <div class="questionContainer">
                <p id="questionNumber"></p>
                <h2 id="question"></h2>
                <div id="answers" class="answersContainer"></div>
                <button id="nextQuestion" class="nextButton hidden">
                    Question suivante
                </button>
            </div>
        </section>


        <!-- Écran de fin -->
        <section id="fin" class="quizScreen hidden">
            <div class="endContainer">

                <h2>QUIZ TERMINÉ</h2>

                <p id="finalScore"></p>

                <p id="finalMessage"></p>

                <button id="restartQuiz" class="restartButton">
                    Rejouer
                </button>

            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
